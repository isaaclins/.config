# ~/.config/tmux/tmux.conf
# Purpose: minimal tmux config for the pi-in-tmux workflow (fish pi wrapper).

# Pi needs CSI-u extended keys for modified Enter and reliable shortcuts.
set -g extended-keys on
set -g extended-keys-format csi-u

# Let plain clicks select/resize tmux panes. Ghostty reserves Shift+drag for
# native persistent selection and Cmd+C (see ghostty/config). Keep Ctrl+drag
# explicitly bound to pane-border resizing as well.
set -g mouse on
bind -n C-MouseDrag1Border resize-pane -M

# Make pane roles unmistakable. pi-codrive exclusively sets
# @pi_codrive_role for orchestrator and subagent Pi panes.
set -g pane-border-status top
set -g pane-border-lines simple
set -g pane-border-style "fg=#4b4743"
set -g pane-active-border-style "fg=#63fad5"
set -g pane-border-format " #{?#{==:#{@pi_codrive_role},subagent},#[fg=#e37bd9 bold]◆ SUBAGENT,#{?#{==:#{@pi_codrive_role},orchestrator},#[fg=#63fad5 bold]◆ ORCHESTRATOR,#[fg=#756e68]• SHELL}} #[fg=#756e68]· #{pane_id} #[default]"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Let Kitty graphics-protocol escape sequences pass through to the outer
# terminal (Ghostty supports the Kitty protocol) so Pi can render
# images (e.g. screenshots read via the Read tool) inline instead of falling
# back to a text placeholder. Keep the outer terminal identity current so the
# tmux image renderer can select the right protocol after attach/reattach.
set -g allow-passthrough on
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE TERM TERM_PROGRAM"

# More scrollback for long agent output.
set -g history-limit 50000

# Move pane focus with plain ctrl+arrows (no prefix), mirroring Ghostty's
# split navigation. Trade-off: shadows ctrl+left/right word-jump inside
# running apps; pi and fish both keep alt+left/right for that.
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# WAD as arrow keys: ctrl+w/a/d send Up/Left/Right to the app in the focused
# pane (companion to the global Hammerspoon fn+WASD remap). Ctrl+S is
# explicitly forwarded because Pi uses it to stash prompts. Trade-off: apps
# inside tmux lose ctrl+w (delete word), ctrl+a (line start), and ctrl+d (EOF;
# type `exit` instead). Ghostty's opt+backspace uses alt+backspace.
bind -n C-w send-keys Up
bind -n C-a send-keys Left
bind -n C-s send-keys C-s
bind -n C-d send-keys Right

# Splits inherit the current pane's cwd. Ghostty forwards cmd+d and
# cmd+shift+d as prefix+% and prefix+" (see ghostty/config keybinds).
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Ghostty forwards cmd+w as prefix+x: kill the focused pane without the
# default confirm prompt, matching how cmd+w closes instantly elsewhere.
bind x kill-pane
